[package]
name = "quorumkv-storage"
version = "0.1.0"
edition = "2021"
description = "quorumkv LSM storage engine (Track A)"

[lib]
name = "storage"
path = "src/lib.rs"

[dependencies]
# Hardware-accelerated CRC32C (SSE4.2) — matches RocksDB/LevelDB choice (phase-01 §2b/§7).
crc32c = "0.6"

# Logging facade only (zero transitive deps, pure Rust — does NOT pull windows-sys,
# unlike env_logger/tracing-subscriber). Our own tiny backend lives in `logger`.
log = "0.4"

# Phase 2: lock-free concurrent ordered map for the memtable (same class RocksDB
# uses). LOCKED in planning/phase-02-memtable.md §2.
crossbeam-skiplist = "0.1"

# Phase 4: fast non-cryptographic hash for the blocked Bloom filter (xxh3).
# Pure Rust, no build script. LOCKED in planning/phase-04-bloom.md §8.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# No dev-dependencies: tests use a small std-only temp-dir helper (see tests/).
# Rationale: the windows-gnu toolchain on this machine has no external mingw, so
# crates using `raw-dylib` system imports (tempfile -> windows-sys) can't link.
# Pure-Rust + crc32c links fine against Rust's pre-shipped system import libs.
